  date: "2026-09"
  summary: "Established in January 2026, the new CLIVAR–CORDEX Joint Working Group on Regional Ocean Climate Projections (JWG-ROCP), co-led by Angélique Melet and myself, aims to strengthen international coordination in regional ocean climate modelling, develop multi-model and multi-region studies, and improve the standardization and dissemination of regional ocean climate projections."
