- id: mediterranean-coastal-upwelling-internship
  title: "Master's internship: Future of Mediterranean coastal upwelling under climate change"
  date: "2026-10"
  summary: "A 5–6 month Master's internship at CNRM, starting in March 2027, will investigate how Mediterranean coastal upwelling may evolve under global warming. Using reanalyses, observations and Med-CORDEX regional climate simulations, the study will explore changes across global warming levels from +1.5°C to +4°C."
  keywords:
